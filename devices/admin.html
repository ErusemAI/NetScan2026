<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NET//CHECK – Admin Dashboard</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #030508;
      --panel: rgba(8, 14, 24, 0.94);
      --panel-border: rgba(0, 240, 255, 0.22);
      --cyan: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.45);
      --magenta: #ff2ec4;
      --magenta-glow: rgba(255, 46, 196, 0.45);
      --green: #3dff9c;
      --green-glow: rgba(61, 255, 156, 0.5);
      --amber: #ffb454;
      --red: #ff4d6d;
      --dim: #5c7587;
      --text: #d4f7ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', ui-monospace, Consolas, monospace;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 24px 18px 60px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% -10%, rgba(0, 240, 255, 0.12), transparent 65%),
        radial-gradient(circle at 90% 100%, rgba(255, 46, 196, 0.08), transparent 50%),
        linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
      background-size: auto, auto, 36px 36px, 36px 36px;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0.25;
      background: repeating-linear-gradient(rgba(0, 0, 0, 0.4) 0 1px, transparent 1px 3px);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      position: relative;
    }

    /* Header & Glitch Title */
    header { text-align: center; margin-bottom: 24px; }

    .glitch-title { font-family: 'Orbitron', monospace; font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; letter-spacing: 0.25em; color: var(--cyan); text-shadow: 0 0 16px var(--cyan-glow), 0 0 32px var(--cyan-glow); margin-bottom: 6px; }

    .subtitle { color: var(--magenta); font-size: 0.88rem; letter-spacing: 0.3em; text-shadow: 0 0 10px var(--magenta-glow); margin-bottom: 14px; }

    /* Navigation Buttons */
    .nav-bar { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }

    .btn-nav { display: inline-flex; align-items: center; gap: 8px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan); font-family: 'Orbitron', monospace; font-size: 0.78rem; letter-spacing: 0.12em; padding: 8px 18px; border-radius: 4px; text-decoration: none; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 0 10px rgba(0, 240, 255, 0.15); }

    .btn-nav:hover { background: var(--cyan); color: #030508; box-shadow: 0 0 20px var(--cyan-glow); }

    .btn-nav.mag { border-color: var(--magenta); color: var(--magenta); background: rgba(255, 46, 196, 0.1); }

    .btn-nav.mag:hover { background: var(--magenta); color: #fff; box-shadow: 0 0 20px var(--magenta-glow); }

    /* Admin Area Content */
    #adminDashboard { }
  </style>
</head>
<body>
  <!-- Header & Navigation -->
  <header class="nav-bar">
    <a href="../netcheck.html" class="btn-nav">← RETURN TO LIVE MONITOR HUD</a>
    <button class="btn-nav" onclick="location.reload()">&#8635; REFRESH ADMIN</button>
  </header>

  <!-- Admin Dashboard Section -->
  <div id="adminDashboard" class="container">
    <h2 class="glitch-title">ADMIN DASHBOARD</h2>
    <p>Here you can log in, view users and permissions, and see the overall scan status.</p>

    <!-- Metric counts -->
    <div id="metricCounts" style="display:flex;gap:20px; margin-top: 12px;">
      <div class="metric-box"><strong id="countUsers"></strong> users</div>
      <div class="metric-box"><strong id="countScans"></strong> scans</div>
      <div class="metric-box"><strong id="countDevices"></strong> devices</div>
    </div>
  </div>

  <!-- Admin dashboard metrics section -->
  <section id="adminMetrics" class="container">
    <h3>Dashboard Metrics</h3>
    <div style="display:flex;gap:20px; margin-top:10px;">
      <div><strong>Users:</strong> <span id="countUsers"></span></div>
      <div><strong>Scans:</strong> <span id="countScans"></span></div>
      <div><strong>Devices:</strong> <span id="countDevices"></span></div>
    </div>

    <!-- Link to device list and user management -->
    <div style="display:flex;gap:20px; margin-top:10px;">
      <a href="index.html" class="btn-nav mag">Device Directory</a>
      <a href="/admin/users.html" class="btn-nav mag">User Management</a>
    </div>
  </section>

  <!-- Admin login form – same as the main HUD -->
  <form id="adminLoginForm" style="display:inline-flex;">
    <input type="text" name="username" placeholder="Admin user">
    <input type="password" name="password" placeholder="Password">
    <button type="submit">Login</button>
  </form>

  <!-- JavaScript -->
  <script>
    // Populate metrics on load
    async function loadMetrics(){
      const users = await fetch('/api/users').then(r=>r.json());
      document.getElementById('countUsers').innerText = users.length;
      const scans = await fetch('/api/scans').then(r=>r.json());
      document.getElementById('countScans').innerText = scans.length;
      const devices = await fetch('/devices/scan_status.json').then(r=>r.json());
      document.getElementById('countDevices').innerText = devices.devicesCount || 0;
    }
    loadMetrics();

    // login form submit handler
    document.getElementById('adminLoginForm').addEventListener('submit', async e=>{
      e.preventDefault();
      const data = new FormData(e.target);
      const body={username:data.get('username'),password:data.get('password')};
      await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(()=>{window.location.href='/devices/admin.html'});
    });
  </script>
</body>
</html>
